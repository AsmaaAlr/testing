<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hijri Date</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: min(92vw, 500px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .hijri {
      font-size: 24px;
      font-weight: bold;
      margin: 12px 0;
    }

    .gregorian {
      font-size: 16px;
      color: #666;
      margin-bottom: 10px;
    }

    .meta {
      font-size: 13px;
      color: #888;
      line-height: 1.6;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    a {
      color: #0a66c2;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hijri Date</h1>
    <div id="hijri" class="hijri">Loading...</div>
    <div id="gregorian" class="gregorian"></div>
    <div id="meta" class="meta"></div>
  </div>

  <script>
    async function loadDate() {
      const hijriEl = document.getElementById("hijri");
      const gregorianEl = document.getElementById("gregorian");
      const metaEl = document.getElementById("meta");

      try {
        const res = await fetch("./date.json?ts=" + Date.now());
        if (!res.ok) throw new Error("Could not load date.json");

        const data = await res.json();

        hijriEl.textContent = data.hijri || "Hijri date unavailable";
        gregorianEl.textContent = data.gregorian || "";
        metaEl.innerHTML = `
          Source: <a href="${data.source}" target="_blank" rel="noopener noreferrer">Alojeiri Calendar</a><br>
          Last updated: ${data.updated_at ? new Date(data.updated_at).toLocaleString() : "Unknown"}
        `;
      } catch (err) {
        hijriEl.textContent = "Hijri date unavailable";
        hijriEl.classList.add("error");
        gregorianEl.textContent = "";
        metaEl.textContent = "Could not load the latest date.";
        console.error(err);
      }
    }

    loadDate();
  </script>
</body>
</html>
