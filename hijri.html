<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hijri Date & Prayer Times</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: min(94vw, 620px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      text-align: center;
    }

    .hijri {
      font-size: 24px;
      font-weight: bold;
      margin: 12px 0;
      text-align: center;
    }

    .gregorian {
      font-size: 16px;
      color: #666;
      margin-bottom: 20px;
      text-align: center;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0 12px;
    }

    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .prayer-item {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .prayer-name {
      font-size: 14px;
      color: #666;
      margin-bottom: 4px;
    }

    .prayer-time {
      font-size: 18px;
      font-weight: bold;
    }

    .meta {
      font-size: 13px;
      color: #888;
      line-height: 1.6;
      margin-top: 18px;
      text-align: center;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    a {
      color: #0a66c2;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hijri Date</h1>
    <div id="hijri" class="hijri">Loading...</div>
    <div id="gregorian" class="gregorian"></div>

    <div class="section-title">Prayer Times</div>
    <div id="prayer-grid" class="prayer-grid"></div>

    <div id="meta" class="meta"></div>
  </div>

  <script>
    function prayerLabel(key) {
      const labels = {
        fajr: "Fajr",
        sunrise: "Sunrise",
        dhuhr: "Dhuhr",
        asr: "Asr",
        maghrib: "Maghrib",
        isha: "Isha"
      };
      return labels[key] || key;
    }

    async function loadDate() {
      const hijriEl = document.getElementById("hijri");
      const gregorianEl = document.getElementById("gregorian");
      const prayerGridEl = document.getElementById("prayer-grid");
      const metaEl = document.getElementById("meta");

      try {
        const res = await fetch("./date.json?ts=" + Date.now());
        if (!res.ok) throw new Error("Could not load date.json");

        const data = await res.json();

        hijriEl.textContent = data.hijri || "Hijri date unavailable";
        gregorianEl.textContent = data.gregorian || "";

        const prayers = data.prayer_times || {};
        prayerGridEl.innerHTML = Object.entries(prayers)
          .map(([key, value]) => `
            <div class="prayer-item">
              <div class="prayer-name">${prayerLabel(key)}</div>
              <div class="prayer-time">${value || "-"}</div>
            </div>
          `)
          .join("");

        metaEl.innerHTML = `
          Source: <a href="${data.source}" target="_blank" rel="noopener noreferrer">Alojeiri Calendar</a><br>
          Last updated: ${data.updated_at ? new Date(data.updated_at).toLocaleString() : "Unknown"}
        `;
      } catch (err) {
        hijriEl.textContent = "Data unavailable";
        hijriEl.classList.add("error");
        gregorianEl.textContent = "";
        prayerGridEl.innerHTML = "";
        metaEl.textContent = "Could not load the latest date and prayer times.";
        console.error(err);
      }
    }

    loadDate();
  </script>
</body>
</html>
